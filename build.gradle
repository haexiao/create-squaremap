plugins {
    id "fabric-loom" version "1.17.20"
}

version = "1.0.0"
group = "bridge"

// jar 命名规范：<名称>-fabric-mc<MC版本>-<版本>.jar（对齐 squaremap 等生态）
base {
    archivesName = "create-squaremap-bridge-fabric-mc1.21.11"
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    // squaremap 通过 Modrinth maven 拉取（代替本地 libs jar）
    maven { url = "https://api.modrinth.com/maven" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.6:v2"
    modImplementation "net.fabricmc:fabric-loader:0.19.5"
    // 编译期需要 fabric-api：squaremap 的 MapUpdateEvents 签名引用 fabric-api 的 Event 类型
    // （squaremap 官方要求 fabric-api，运行时由其依赖声明保证；本 mod 运行时不直接依赖）
    compileOnly "net.fabricmc.fabric-api:fabric-api:0.141.3+1.21.11"
    // squaremap（含 fabric 内部事件类 MapUpdateEvents）
    // 注意：Modrinth 上 1.3.12 同时有 fabric/paper/neoforge/sponge 四个版本，
    // 用版本 ID（BW8lMXBi = fabric 1.3.12 + 1.21.11）精确定位，避免拉到错误 loader 的 jar
    // modImplementation 让 loom 自动把 intermediary 映射 remap 到 yarn
    modImplementation "maven.modrinth:squaremap:BW8lMXBi"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
